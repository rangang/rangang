<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060616"/>
      <stop offset="0.5" stop-color="#0b0a26"/>
      <stop offset="1" stop-color="#04101c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a89bff"/>
      <stop offset="0.55" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#e6e9ff"/>
      <stop offset="0.45" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#2a1a6e"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#4a2f9e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4a2f9e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <ellipse cx="520" cy="80" rx="170" ry="90" fill="#4a2f9e" opacity="0.32">
      <animateTransform attributeName="transform" type="translate" values="0 0; 16 -10; 0 0" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="110" cy="300" rx="180" ry="80" fill="#0e4d6e" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; -14 8; 0 0" dur="18s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g fill="#ffffff">
    <circle cx="60" cy="50" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="30" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="40" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="180" r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="180" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="320" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="330" r="1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 顶部小轨道 -->
  <g transform="translate(320 78)">
    <circle r="52" fill="url(#halo)"/>
    <ellipse rx="46" ry="16" fill="none" stroke="#8b7cff" stroke-width="1.1" opacity="0.55" transform="rotate(-16)"/>
    <circle r="10" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="9;11;9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <g transform="rotate(-16)">
      <circle r="3" fill="#00e5ff" filter="url(#glow)">
        <animateMotion dur="7s" repeatCount="indefinite" path="M 46 0 A 46 16 0 1 1 -46 0 A 46 16 0 1 1 46 0"/>
      </circle>
    </g>
  </g>

  <!-- 居中文字 -->
  <text x="320" y="164" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="11" letter-spacing="5" fill="#7f86b8">RANGANG · CHONGQING</text>
  <text x="320" y="216" text-anchor="middle" font-size="46" font-weight="800" fill="url(#title)" letter-spacing="4">前端阿刚</text>
  <rect x="220" y="234" width="200" height="2.5" rx="1.25" fill="url(#rule)">
    <animate attributeName="width" values="150;220;150" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="245;210;245" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="320" y="270" text-anchor="middle" font-size="19" font-weight="600" fill="#eef0ff" letter-spacing="2">AI 全栈开发者</text>
  <text x="320" y="300" text-anchor="middle" font-size="13" fill="#9aa0c8">让 AI 走出对话框，成为真正可用的产品</text>
  <text x="320" y="334" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="10" letter-spacing="2" fill="#6f76a8">AI APPS / FULL-STACK / INTERACTION</text>
</svg>