<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050514">
        <animate attributeName="stop-color" values="#050514;#0a0620;#050514" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#04101c">
        <animate attributeName="stop-color" values="#04101c;#120826;#04101c" dur="11s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="0.6" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#cfd3ff"/>
      <stop offset="0.45" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#2a1a6e"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="430" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <ellipse cx="400" cy="130" rx="220" ry="100" fill="#4a2f9e" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 -10; 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="620" cy="330" rx="180" ry="80" fill="#0e4d6e" opacity="0.28">
      <animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="160" cy="360" rx="180" ry="70" fill="#6e1046" opacity="0.18"/>
  </g>

  <g fill="#ffffff">
    <circle cx="70" cy="60" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="40" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="50" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="90" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="200" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="210" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="380" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="390" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.3s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="25" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 轨道核心 -->
  <g transform="translate(400 138)">
    <g fill="none" stroke-width="1.2">
      <g transform="rotate(-16)">
        <ellipse rx="105" ry="33" stroke="#8b7cff" opacity="0.55"/>
        <g transform="scale(1 0.314)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
            <circle cx="105" cy="0" r="4.6" fill="#00e5ff" filter="url(#glow)"/>
          </g>
        </g>
      </g>
      <g transform="rotate(24)">
        <ellipse rx="148" ry="47" stroke="#00e5ff" opacity="0.4"/>
        <g transform="scale(1 0.3176)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
            <circle cx="148" cy="0" r="3.8" fill="#ff2e88" filter="url(#glow)"/>
          </g>
        </g>
      </g>
      <g transform="rotate(-50)">
        <ellipse rx="185" ry="58" stroke="#ff2e88" opacity="0.26"/>
        <g transform="scale(1 0.3135)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
            <circle cx="185" cy="0" r="3.2" fill="#ffb300" filter="url(#glow)"/>
          </g>
        </g>
      </g>
    </g>
    <circle r="46" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="44;50;44" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="58" fill="none" stroke="#8b7cff" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="52;68;52" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.05;0.55" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text y="7" text-anchor="middle" font-size="26" font-weight="800" fill="#050514" font-family="Consolas,monospace">R</text>
  </g>

  <!-- 文字区 -->
  <text x="400" y="272" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="12" letter-spacing="6" fill="#00e5ff" opacity="0.9">3D INTERACTIVE EXPERIENCE</text>
  <text x="400" y="322" text-anchor="middle" font-size="54" font-weight="800" letter-spacing="10" fill="url(#title)" filter="url(#glow)">RANGANG</text>
  <text x="400" y="356" text-anchor="middle" font-size="20" font-weight="600" fill="#eef0ff" letter-spacing="3">前端阿刚 · AI 全栈开发者</text>

  <g transform="translate(245 378)">
    <rect width="310" height="40" rx="20" fill="#0c0d22" stroke="url(#cta)" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="26" cy="20" r="3.6" fill="#00e5ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="26" font-size="15" font-weight="700" fill="#eef0ff" letter-spacing="2">进入 3D 代码星域</text>
    <text x="266" y="26" font-size="16" fill="#00e5ff">→</text>
  </g>

  <rect x="0" y="428" width="800" height="2" fill="url(#cta)" opacity="0.7"/>
</svg>