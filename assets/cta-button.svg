<svg xmlns="http://www.w3.org/2000/svg" width="560" height="96" viewBox="0 0 560 96" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0d22"/>
      <stop offset="1" stop-color="#0a1424"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="552" height="88" rx="18" fill="url(#fill)"/>
  <rect x="4" y="4" width="552" height="88" rx="18" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="14 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <circle cx="42" cy="48" r="14" fill="none" stroke="#8b7cff" stroke-width="1.6" opacity="0.8">
    <animate attributeName="r" values="12;17;12" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="42" cy="48" r="6" fill="#00e5ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <text x="76" y="44" font-size="22" font-weight="800" fill="#eef0ff" letter-spacing="3">进入 3D 代码星域</text>
  <text x="76" y="68" font-family="Consolas,'Courier New',monospace" font-size="11" letter-spacing="4" fill="#9aa0c8">DRAG · RESHAPE · EXPLORE</text>

  <g transform="translate(498 48)" stroke="#00e5ff" stroke-width="2.4" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M-10 0 H10 M3 -7 L10 0 L3 7">
      <animateTransform attributeName="transform" type="translate" values="0 0; 6 0; 0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>