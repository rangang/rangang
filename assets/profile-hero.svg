<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title">
<title id="title">阿刚 | 人工智能全栈开发者 | 让智能成为产品，让想法触手可及。</title>
<defs>
  <linearGradient id="ink"><stop stop-color="#6fffe3"/><stop offset=".52" stop-color="#76caff"/><stop offset="1" stop-color="#a899ff"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#1c4c60" stop-opacity=".7"/><stop offset="1" stop-color="#080c17" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a4cee2" stroke-opacity=".07"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
  text {font-family: 'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}
  .mono {font-family: Consolas,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',monospace}
  .orbit {transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}
  .reverse {animation-direction:reverse;animation-duration:25s}
  .pulse {animation:pulse 4s ease-in-out infinite}
  .scan {animation:scan 9s linear infinite}
  .cursor {animation:pulse 1.5s steps(2,end) infinite}
  @keyframes spin {to {transform:rotate(360deg)}}
  @keyframes pulse {0%,100% {opacity:.35} 50% {opacity:1}}
  @keyframes scan {0% {transform:translateY(-80px);opacity:0} 12%,80% {opacity:.6} 100% {transform:translateY(510px);opacity:0}}
  @media (prefers-reduced-motion:reduce) {.orbit,.pulse,.scan,.cursor {animation:none} .scan {display:none}}
</style>
<rect x="1" y="1" width="1278" height="508" rx="20" fill="#080c17" stroke="#263c50"/>
<rect x="2" y="2" width="1276" height="506" rx="20" fill="url(#grid)"/>
<ellipse cx="1150" cy="200" rx="410" ry="310" fill="url(#aura)"/>
<path d="M58 40h28" stroke="#6fffe3" stroke-width="3"/>
<text x="98" y="45" fill="#7ef9df" font-size="13" letter-spacing="3" class="mono">阿刚 / 数字空间</text>
<text x="53" y="181" fill="url(#ink)" font-size="126" font-weight="700" letter-spacing="6">阿刚<tspan fill="#75ffe0">。</tspan></text>
<text x="58" y="238" fill="#e0edf8" font-size="30" font-weight="500" letter-spacing="2">人工智能全栈开发者</text>
<text x="58" y="284" fill="#8da8be" font-size="21">让智能成为产品，让想法触手可及。</text>
<g transform="translate(1000 250) scale(1.12)">
  <circle r="245" fill="url(#aura)"/>
  <g stroke="#3f8296" fill="none" stroke-width="1"><circle r="175" stroke-dasharray="2 12"/><circle r="151" opacity=".5"/><path d="M-194 0h388M0-194v388" opacity=".4"/></g>
  <g class="orbit" fill="none" stroke="#68f7dc"><circle r="167" stroke-dasharray="105 944" stroke-width="3"/><circle cx="0" cy="-167" r="5" fill="#68f7dc"/></g>
  <g class="orbit reverse" fill="none" stroke="#938eff"><ellipse rx="126" ry="67" transform="rotate(-35)"/><circle cx="103" cy="-57" r="5" fill="#938eff"/></g>
  <g fill="none" stroke="#5ee8d3" stroke-opacity=".4"><path d="m0-108 94 54v108l-94 54-94-54V-54Z"/><path d="m0-108 0 216M-94-54 94 54M94-54-94 54"/></g>
  <rect x="-57" y="-57" width="114" height="114" rx="22" fill="#69f8d2" opacity=".15" filter="url(#glow)"/>
  <rect x="-54" y="-54" width="108" height="108" rx="20" fill="#0d242b" stroke="#71ffe0"/>
  <text x="0" y="12" text-anchor="middle" fill="#b2ffea" font-size="34" font-weight="600">智能</text>
  <g fill="#7affe2" class="pulse"><circle cy="-108" r="4"/><circle cx="94" cy="54" r="4"/><circle cx="-94" cy="54" r="4"/></g>
</g>
<g transform="translate(58 348)">
  <rect width="633" height="54" rx="8" fill="#0d1723" stroke="#253c50"/>
  <text x="18" y="33" class="mono" font-size="19" fill="#83a2bc"><tspan fill="#70ffe0">&gt;</tspan> 构建路径：想法 → 智能 → 产品</text>
  <path class="cursor" d="M499 19v19" stroke="#70ffe0" stroke-width="9"/>
</g>
<path d="M58 481h32m8 0h6" stroke="#6fffe3" stroke-width="2"/>
<text x="1222" y="485" text-anchor="end" fill="#66839d" font-size="12" letter-spacing="2" class="mono">思考 / 构建 / 迭代</text>
<rect class="scan" x="2" y="2" width="1276" height="1" fill="#8bffe4" opacity=".3"/>
</svg>