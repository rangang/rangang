<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050514">
        <animate attributeName="stop-color" values="#050514;#0a0620;#050514" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#0b0a26"/>
      <stop offset="1" stop-color="#04101c">
        <animate attributeName="stop-color" values="#04101c;#120826;#04101c" dur="11s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="0.6" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#cfd3ff"/>
      <stop offset="0.45" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#2a1a6e"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- 星云 -->
  <g filter="url(#soft)">
    <ellipse cx="960" cy="150" rx="200" ry="110" fill="#4a2f9e" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; 24 -14; 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1130" cy="250" rx="170" ry="90" fill="#0e4d6e" opacity="0.32">
      <animateTransform attributeName="transform" type="translate" values="0 0; -20 12; 0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="240" cy="320" rx="220" ry="80" fill="#6e1046" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 -8; 0 0" dur="19s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 星星 -->
  <g fill="#ffffff">
    <circle cx="90" cy="50" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="90" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="40" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="75" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="35" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="110" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="290" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="310" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="280" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.3s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="60" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.7s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="320" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="45" r="1.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="330" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.9s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="30" r="1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#00e5ff">
    <circle cx="300" cy="120" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="200" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="120" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.7s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 轨道核心 -->
  <g transform="translate(985 178)">
    <g fill="none" stroke-width="1.2">
      <g transform="rotate(-18)">
        <ellipse rx="120" ry="38" stroke="#8b7cff" opacity="0.55"/>
        <g transform="scale(1 0.3167)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
            <circle cx="120" cy="0" r="5" fill="#00e5ff" filter="url(#glow)"/>
          </g>
        </g>
      </g>
      <g transform="rotate(22)">
        <ellipse rx="165" ry="54" stroke="#00e5ff" opacity="0.4"/>
        <g transform="scale(1 0.3273)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
            <circle cx="165" cy="0" r="4" fill="#ff2e88" filter="url(#glow)"/>
          </g>
        </g>
      </g>
      <g transform="rotate(-52)">
        <ellipse rx="205" ry="66" stroke="#ff2e88" opacity="0.28"/>
        <g transform="scale(1 0.322)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
            <circle cx="205" cy="0" r="3.4" fill="#ffb300" filter="url(#glow)"/>
          </g>
        </g>
      </g>
    </g>
    <circle r="54" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="52;58;52" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="66" fill="none" stroke="#8b7cff" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="60;78;60" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.05;0.55" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text y="8" text-anchor="middle" font-size="30" font-weight="800" fill="#050514" font-family="Consolas,monospace">R</text>
  </g>

  <!-- 文字区 -->
  <text x="80" y="86" font-family="Consolas,'Courier New',monospace" font-size="14" letter-spacing="7" fill="#00e5ff" opacity="0.9">PORTFOLIO · 3D INTERACTIVE EXPERIENCE</text>
  <text x="76" y="168" font-size="82" font-weight="800" letter-spacing="12" fill="url(#title)" filter="url(#glow)">RANGANG</text>
  <text x="80" y="212" font-size="26" font-weight="600" fill="#eef0ff" letter-spacing="3">前端阿刚 · AI 全栈开发者</text>
  <text x="80" y="246" font-size="16" fill="#9aa0c8" letter-spacing="2">让 AI 走出对话框，成为真正可用的产品。这片星域由代码驱动。</text>

  <!-- CTA -->
  <g transform="translate(80 272)">
    <rect width="310" height="48" rx="24" fill="#0c0d22" stroke="url(#cta)" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="28" cy="24" r="4" fill="#00e5ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="30" font-size="17" font-weight="700" fill="#eef0ff" letter-spacing="2">进入 3D 代码星域</text>
    <text x="262" y="30" font-size="18" fill="#00e5ff">→</text>
  </g>

  <!-- 扫光 -->
  <rect x="-260" y="0" width="240" height="360" fill="url(#sweep)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1560 0" dur="6.5s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="358" width="1280" height="2" fill="url(#cta)" opacity="0.7"/>
</svg>