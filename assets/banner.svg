<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060616"/>
      <stop offset="0.5" stop-color="#0b0a26"/>
      <stop offset="1" stop-color="#04101c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a89bff"/>
      <stop offset="0.55" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="0.6" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#e6e9ff"/>
      <stop offset="0.45" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#2a1a6e"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#4a2f9e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4a2f9e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- 星云 -->
  <g filter="url(#soft)">
    <ellipse cx="1010" cy="140" rx="230" ry="120" fill="#4a2f9e" opacity="0.32">
      <animateTransform attributeName="transform" type="translate" values="0 0; 22 -12; 0 0" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1180" cy="280" rx="180" ry="95" fill="#0e4d6e" opacity="0.34">
      <animateTransform attributeName="transform" type="translate" values="0 0; -18 10; 0 0" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="180" cy="330" rx="240" ry="80" fill="#6e1046" opacity="0.16">
      <animateTransform attributeName="transform" type="translate" values="0 0; 16 -8; 0 0" dur="20s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 星点 -->
  <g fill="#ffffff">
    <circle cx="70" cy="46" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="96" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="38" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="70" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="30" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="120" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="200" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="300" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="230" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="60" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="330" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="330" r="1"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 左侧文字区 -->
  <g>
    <text x="80" y="96" font-family="Consolas,'Courier New',monospace" font-size="14" letter-spacing="6" fill="#7f86b8">RANGANG · CHONGQING · UTC+8</text>
    <text x="78" y="176" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="4">前端阿刚</text>
    <rect x="80" y="200" width="300" height="3" rx="1.5" fill="url(#rule)">
      <animate attributeName="width" values="220;320;220" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="242" font-size="24" font-weight="600" fill="#eef0ff" letter-spacing="2">AI 全栈开发者</text>
    <text x="80" y="278" font-size="16" fill="#9aa0c8" letter-spacing="1">让 AI 走出对话框，成为真正可用的产品</text>
    <g font-family="Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#6f76a8">
      <text x="80" y="318">AI APPS</text>
      <text x="180" y="318" fill="#8b7cff">/</text>
      <text x="204" y="318">FULL-STACK</text>
      <text x="330" y="318" fill="#00e5ff">/</text>
      <text x="354" y="318">INTERACTION</text>
    </g>
  </g>

  <!-- 右侧轨道星系 -->
  <g transform="translate(980 180)">
    <circle r="150" fill="url(#halo)"/>

    <!-- 轨道 -->
    <g fill="none" stroke-width="1.2">
      <ellipse rx="132" ry="46" stroke="#8b7cff" opacity="0.5" transform="rotate(-18)"/>
      <ellipse rx="104" ry="104" stroke="#00e5ff" opacity="0.28"/>
      <ellipse rx="72" ry="26" stroke="#ff2e88" opacity="0.4" transform="rotate(24)"/>
    </g>

    <!-- 核心 -->
    <circle r="26" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="24;28;24" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="38" fill="none" stroke="#cfd3ff" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="32;46;32" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- 轨道粒子：外层 -->
    <g transform="rotate(-18)">
      <circle r="5" fill="#00e5ff" filter="url(#glow)">
        <animateMotion dur="9s" repeatCount="indefinite" path="M 132 0 A 132 46 0 1 1 -132 0 A 132 46 0 1 1 132 0"/>
      </circle>
      <circle r="3" fill="#a89bff">
        <animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite" path="M 132 0 A 132 46 0 1 1 -132 0 A 132 46 0 1 1 132 0"/>
      </circle>
    </g>
    <!-- 轨道粒子：中层 -->
    <g>
      <circle r="4" fill="#ff2e88" filter="url(#glow)">
        <animateMotion dur="13s" repeatCount="indefinite" path="M 104 0 A 104 104 0 1 1 -104 0 A 104 104 0 1 1 104 0"/>
      </circle>
    </g>
    <!-- 轨道粒子：内层 -->
    <g transform="rotate(24)">
      <circle r="3.4" fill="#eef0ff">
        <animateMotion dur="6s" repeatCount="indefinite" path="M 72 0 A 72 26 0 1 1 -72 0 A 72 26 0 1 1 72 0"/>
      </circle>
    </g>

    <!-- 星座连线 -->
    <g stroke="#7f86b8" stroke-width="0.8" opacity="0.5">
      <path d="M -190 -96 L -150 -60 L -168 -12" fill="none"/>
      <circle cx="-190" cy="-96" r="2" fill="#9aa0c8" stroke="none"/>
      <circle cx="-150" cy="-60" r="2.4" fill="#00e5ff" stroke="none"/>
      <circle cx="-168" cy="-12" r="2" fill="#9aa0c8" stroke="none"/>
      <path d="M 150 96 L 196 64 L 214 110" fill="none"/>
      <circle cx="150" cy="96" r="2" fill="#9aa0c8" stroke="none"/>
      <circle cx="196" cy="64" r="2.4" fill="#ff2e88" stroke="none"/>
      <circle cx="214" cy="110" r="2" fill="#9aa0c8" stroke="none"/>
    </g>
  </g>

  <!-- 底部渐隐 -->
  <rect y="344" width="1280" height="16" fill="#050514" opacity="0.6"/>
</svg>