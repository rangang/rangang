<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title">
<title id="title">人工智能全栈：智能应用、全栈工程、产品体验</title>
<defs>
  <linearGradient id="ink"><stop stop-color="#6fffe3"/><stop offset=".52" stop-color="#76caff"/><stop offset="1" stop-color="#a899ff"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#1c4c60" stop-opacity=".7"/><stop offset="1" stop-color="#080c17" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a4cee2" stroke-opacity=".07"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
  text {font-family: 'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}
  .mono {font-family: Consolas,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',monospace}
  .orbit {transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}
  .reverse {animation-direction:reverse;animation-duration:25s}
  .pulse {animation:pulse 4s ease-in-out infinite}
  .scan {animation:scan 9s linear infinite}
  .cursor {animation:pulse 1.5s steps(2,end) infinite}
  @keyframes spin {to {transform:rotate(360deg)}}
  @keyframes pulse {0%,100% {opacity:.35} 50% {opacity:1}}
  @keyframes scan {0% {transform:translateY(-80px);opacity:0} 12%,80% {opacity:.6} 100% {transform:translateY(340px);opacity:0}}
  @media (prefers-reduced-motion:reduce) {.orbit,.pulse,.scan,.cursor {animation:none} .scan {display:none}}
</style>
<rect x="1" y="1" width="638" height="338" rx="20" fill="#080c17" stroke="#263c50"/>
<rect x="2" y="2" width="636" height="336" rx="20" fill="url(#grid)"/>
<text x="28" y="36" fill="#7b9bb5" font-size="13" letter-spacing="3" class="mono">我的构建方式</text><rect x="28" y="68" width="584" height="68" rx="9" fill="#0d1724" stroke="#284557"/><text x="46" y="96" fill="#70ffe0" class="mono" font-size="13">01</text><text x="84" y="96" fill="#dceafa" font-size="18" letter-spacing="1">智能应用</text><text x="84" y="120" fill="#8ea6be" font-size="14" class="mono">大模型 / 智能工具</text><rect x="28" y="150" width="584" height="68" rx="9" fill="#0d1724" stroke="#284557"/><text x="46" y="178" fill="#70ffe0" class="mono" font-size="13">02</text><text x="84" y="178" fill="#dceafa" font-size="18" letter-spacing="1">全栈工程</text><text x="84" y="202" fill="#8ea6be" font-size="14" class="mono">接口 / 数据 / 服务</text><rect x="28" y="232" width="584" height="68" rx="9" fill="#0d1724" stroke="#284557"/><text x="46" y="260" fill="#70ffe0" class="mono" font-size="13">03</text><text x="84" y="260" fill="#dceafa" font-size="18" letter-spacing="1">产品体验</text><text x="84" y="284" fill="#8ea6be" font-size="14" class="mono">网页 / 桌面 / 交互</text>
</svg>